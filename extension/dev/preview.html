<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fine Print — UI preview</title>
    <!-- Static UI harness: no chrome.* APIs. Serve from extension/:  python3 -m http.server 8765
         then open http://localhost:8765/dev/preview.html  (?only=setup|overview|chat|loading|cards, ?embed=chat for one full-height panel) -->
    <link rel="stylesheet" href="../src/ui/ui.css" />
    <style>
      body.gallery { background: #f1eee7; padding: 24px 24px 80px; margin: 0; }
      .gallery-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; max-width: 1800px; margin: 0 auto 20px; }
      .gallery-head h1 { font: 400 40px/1 var(--serif); margin: 0; }
      .gallery-head h1 em { color: var(--muted); }
      .gallery-head .tools { display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--muted); }
      .gallery-head button { border: 1px solid var(--line-2); background: #fff; border-radius: 8px; padding: 6px 10px; font-size: 12px; }
      .row { display: flex; flex-wrap: wrap; gap: 28px; max-width: 1800px; margin: 0 auto 36px; align-items: flex-start; }
      .slot { display: flex; flex-direction: column; gap: 8px; }
      .slot > .label { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
      .shell { width: 420px; display: flex; flex-direction: column; gap: 8px; }
      .frame { height: 832px; width: 420px; border: 1px solid var(--line-2); border-radius: 22px; overflow: hidden; background: var(--paper); box-shadow: 0 24px 60px rgba(60, 48, 28, .16), 0 1px 2px rgba(60, 48, 28, .08); }
      .frame.panel { height: 832px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fill, 384px); gap: 28px; max-width: 1800px; margin: 0 auto; }
      .cards .ub-card { width: 384px; }
      /* the slide-out's Shortlist button (real one lives in content/inject.js's shadow root) */
      .shortlist { height: 46px; border: none; border-radius: 14px; background: #2f64d9; color: #fff; font: 600 14px var(--sans); display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 24px rgba(47, 100, 217, .28), inset 0 1px 0 rgba(255, 255, 255, .18); }
      .shortlist .k { display: inline-grid; place-items: center; height: 20px; padding: 0 6px; border-radius: 5px; background: rgba(255, 255, 255, .18); font: 400 10px var(--mono); }
      body.embed { height: 100vh; }
    </style>
  </head>
  <body>
    <script type="module" src="preview.js"></script>
  </body>
</html>
